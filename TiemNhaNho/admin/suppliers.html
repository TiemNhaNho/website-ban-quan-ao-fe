<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lí Nhà Cung Cấp - Admin</title>
  <link rel="stylesheet" href="../css/normalize.css">
  <link rel="stylesheet" href="../icomoon/icomoon.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="css/admin-style.css">
</head>
<body class="admin-layout">
  <div class="admin-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2 class="logo">Tiệm Nhà Nhỏ</h2>
      </div>
      <nav class="sidebar-nav">
        <ul class="nav-list">
          <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="icon icon-screen-full"></i><span>Dashboard</span></a></li>
          <li class="nav-item"><a href="orders.html" class="nav-link"><i class="icon icon-shopping-cart"></i><span>Quản lí Đơn Hàng</span></a></li>
          <li class="nav-item"><a href="products.html" class="nav-link"><i class="icon icon-tags"></i><span>Quản lí Sản Phẩm</span></a></li>
          <li class="nav-item "><a href="customers.html" class="nav-link"><i class="icon icon-user"></i><span>Quản lí Khách Hàng</span></a></li>
          <li class="nav-item active"><a href="suppliers.html" class="nav-link"><i class="icon icon-truck"></i><span>Quản lí Nhà Cung Cấp</span></a></li>
          <li class="nav-item "><a href="categories.html" class="nav-link"><i class="icon icon-tags1"></i><span>Quản lí Danh Mục</span></a></li>
          <li class="nav-item"><a href="coupons.html" class="nav-link"><i class="icon icon-add"></i><span>Quản lí Mã Giảm Giá</span></a></li>
        </ul>
      </nav>
    </aside>

      <main class="main-content">
        <header class="admin-header">
          <div class="header-left">
            <h1>Quản lí Nhà Cung Cấp</h1>
          </div>
        </header>

        <section class="page-content">
          <div class="container-fluid">
            <div class="card">
              <div class="card-header">
                <h3>Danh Sách Nhà Cung Cấp</h3>
                <div style="display: flex; gap: 1rem; align-items: center">
                  <input
                    type="text"
                    id="searchInput"
                    placeholder="Tìm kiếm nhà cung cấp..."
                    onkeyup="searchTable()"
                    style="
                      padding: 0.5rem 1rem;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                      width: 250px;
                    "
                  />
                  <button class="btn btn-primary" onclick="openAddModal()">
                    + Thêm Nhà Cung Cấp
                  </button>
                </div>
              </div>

              <table class="table" id="suppliersTable">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Tên Nhà Cung Cấp</th>
                    <th>Email</th>
                    <th>SĐT</th>
                    <th>Địa Chỉ</th>
                    <th>Hành Động</th>
                  </tr>
                </thead>
                <tbody id="suppliersBody">
                  <!-- Suppliers will be loaded here -->
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="modal" id="supplierModal">
      <div class="modal-content" style="padding: 24px">
        <div class="modal-header">
          <h2>Thêm/Sửa Nhà Cung Cấp</h2>
          <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="supplierForm">
          <div class="form-group">
            <label>Tên Nhà Cung Cấp</label>
            <input type="text" required />
          </div>
          <div class="form-group" style="display: none">
            <!-- Hidden email as API handles name, phone, address -->
            <label>Email</label>
            <input type="email" />
          </div>
          <div class="form-group">
            <label>SĐT</label>
            <input type="tel" required />
          </div>
          <div class="form-group">
            <label>Địa Chỉ</label>
            <textarea rows="3" required></textarea>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal()"
            >
              Hủy
            </button>
            <button type="submit" class="btn btn-primary">Lưu</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../js/jquery-1.11.0.min.js"></script>
    <script src="js/admin.js"></script>
    <script type="module">
      import { getAllSuppliers, handleSupplierSubmit } from "./js/suppliers.js";

      document.addEventListener("DOMContentLoaded", getAllSuppliers);

      document
        .getElementById("supplierForm")
        .addEventListener("submit", handleSupplierSubmit);

      // Override searchTable
      window.searchTable = function () {
        const input = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const tbody = document.getElementById("suppliersBody");
        const rows = tbody.getElementsByTagName("tr");

        for (let row of rows) {
          const name = row.cells[1]?.textContent || "";
          const phone = row.cells[2]?.textContent || "";
          const address = row.cells[3]?.textContent || "";

          if (
            name.toLowerCase().includes(input) ||
            phone.toLowerCase().includes(input) ||
            address.toLowerCase().includes(input)
          ) {
            row.style.display = "";
          } else {
            row.style.display = "none";
          }
        }
      };

      // Swipe listener
      function addSwipeListener(modalId) {
        const modal = document.getElementById(modalId);
        if (!modal) return;
        let touchStartY = 0;
        modal.addEventListener("touchstart", (e) => {
          touchStartY = e.touches[0].clientY;
        });
        modal.addEventListener("touchend", (e) => {
          if (touchStartY - e.changedTouches[0].clientY > 100) {
            modal.classList.add("closing");
            setTimeout(() => {
              modal.style.display = "none";
              modal.classList.remove("closing");
            }, 300);
          }
        });
      }

      addSwipeListener("supplierModal");
    </script>
  </body>
</html>
