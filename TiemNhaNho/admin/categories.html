<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lí Danh Mục - Admin</title>
  <link rel="stylesheet" href="../css/normalize.css">
  <link rel="stylesheet" href="../icomoon/icomoon.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="css/admin-style.css">
</head>
<body class="admin-layout">
  <div class="admin-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2 class="logo">Tiệm Nhà Nhỏ</h2>
      </div>
      <nav class="sidebar-nav">
        <ul class="nav-list">
           <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="icon icon-screen-full"></i><span>Dashboard</span></a></li>
          <li class="nav-item"><a href="orders.html" class="nav-link"><i class="icon icon-shopping-cart"></i><span>Quản lí Đơn Hàng</span></a></li>
          <li class="nav-item"><a href="products.html" class="nav-link"><i class="icon icon-tags"></i><span>Quản lí Sản Phẩm</span></a></li>
          <li class="nav-item "><a href="customers.html" class="nav-link"><i class="icon icon-user"></i><span>Quản lí Khách Hàng</span></a></li>
          <li class="nav-item "><a href="suppliers.html" class="nav-link"><i class="icon icon-truck"></i><span>Quản lí Nhà Cung Cấp</span></a></li>
          <li class="nav-item active"><a href="categories.html" class="nav-link"><i class="icon icon-tags1"></i><span>Quản lí Danh Mục</span></a></li>
          <li class="nav-item"><a href="coupons.html" class="nav-link"><i class="icon icon-add"></i><span>Quản lí Mã Giảm Giá</span></a></li>
        </ul>
      </nav>
    </aside>

    <main class="main-content">
      <header class="admin-header">
        <div class="header-left">
          <h1>Quản lí Danh Mục</h1>
        </div>
      </header>

      <section class="page-content">
        <div class="container-fluid">
          <div class="card">
            <div class="card-header">
              <h3>Danh Sách Danh Mục</h3>
              <div style="display: flex; gap: 1rem; align-items: center;">
                <input type="text" id="searchInput" placeholder="Tìm kiếm danh mục..." onkeyup="searchTable()" style="padding: 0.5rem 1rem; border: 1px solid #ddd; border-radius: 4px; width: 250px;">
                <button class="btn btn-primary" onclick="openAddModal()">+ Thêm Danh Mục</button>
              </div>
            </div>

            <table class="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Tên Danh Mục</th>
                  <th>Mô Tả</th>
                  <th>Số Sản Phẩm</th>
                  <th>Hành Động</th>
                </tr>
              </thead>
              <tbody id="categoriesBody">
                <tr class="category-row" onclick="openViewModal(1)">
                  <td>1</td>
                  <td>Nam</td>
                  <td>Sản phẩm dành cho nam</td>
                  <td>125</td>
                  <td onclick="event.stopPropagation()">
                    <button class="btn-icon" onclick="openEditModal(1)" title="Sửa"><img src="../images/sua.png" alt="Sửa" class="icon-img"></button>
                    <button class="btn-icon" onclick="deleteCategory(1)" title="Xóa"><img src="../images/huy.png" alt="Xóa" class="icon-img"></button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="categoryModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Thêm/Sửa Danh Mục</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="categoryForm">
        <div class="form-group">
          <label>Tên Danh Mục</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Mô Tả</label>
          <textarea rows="3"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function searchTable() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const tbody = document.getElementById('categoriesBody');
      const rows = tbody.getElementsByTagName('tr');
      
      for (let row of rows) {
        const name = row.cells[1]?.textContent || '';
        const description = row.cells[2]?.textContent || '';
        
        if (name.toLowerCase().includes(input) || description.toLowerCase().includes(input)) {
          row.style.display = '';
        } else {
          row.style.display = 'none';
        }
      }
    }

    const categoriesData = {
      1: { id: 1, name: 'Nam', description: 'Sản phẩm dành cho nam', productCount: 125 },
      2: { id: 2, name: 'Nữ', description: 'Sản phẩm dành cho nữ', productCount: 98 },
      3: { id: 3, name: 'Unisex', description: 'Sản phẩm dành cho cả nam và nữ', productCount: 45 }
    };

    function openAddModal() {
      document.getElementById('categoryForm').reset();
      document.getElementById('categoryForm').dataset.categoryId = '';
      openModal('categoryModal');
    }

    function openEditModal(id) {
      const category = categoriesData[id];
      const inputs = document.querySelectorAll('#categoryForm input, #categoryForm textarea');
      inputs[0].value = category.name;
      inputs[1].value = category.description;
      document.getElementById('categoryForm').dataset.categoryId = id;
      openModal('categoryModal');
    }

    function openViewModal(id) {
      const category = categoriesData[id];
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.id = 'viewModal';
      modal.style.display = 'block';
      modal.innerHTML = `
        <div class="modal-content">
          <div class="modal-header">
            <h2>Chi Tiết Danh Mục</h2>
            <button class="close-btn" onclick="this.closest('.modal').remove()">&times;</button>
          </div>
          <div class="modal-body">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div><strong>Tên Danh Mục:</strong> <p>${category.name}</p></div>
              <div><strong>Số Sản Phẩm:</strong> <p>${category.productCount}</p></div>
              <div colspan="2"><strong>Mô Tả:</strong> <p>${category.description}</p></div>
            </div>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      addSwipeListener('viewModal');
    }

    function deleteCategory(id) {
      if(!confirmDelete('danh mục')) return;
      delete categoriesData[id];
      const tbody = document.getElementById('categoriesBody');
      tbody.querySelectorAll('tr').forEach(row => {
        if(parseInt(row.cells[0].textContent) === id) row.remove();
      });
      showToast('Đã xóa danh mục');
    }

    function addSwipeListener(modalId) {
      const modal = document.getElementById(modalId);
      let touchStartY = 0;
      modal.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; });
      modal.addEventListener('touchend', e => {
        if(touchStartY - e.changedTouches[0].clientY > 100) {
          modal.classList.add('closing');
          setTimeout(() => modal.remove(), 300);
        }
      });
    }

    document.getElementById('categoryForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const inputs = this.querySelectorAll('input, textarea');
      const categoryId = this.dataset.categoryId;
      const id = categoryId ? parseInt(categoryId) : Math.max(...Object.keys(categoriesData).map(Number)) + 1;
      
      categoriesData[id] = {
        id: id,
        name: inputs[0].value,
        description: inputs[1].value,
        productCount: categoriesData[id]?.productCount || 0
      };

      const tbody = document.getElementById('categoriesBody');
      const existingRow = tbody.querySelector(`tr[data-id="${id}"]`);
      
      if(existingRow) {
        existingRow.cells[1].textContent = inputs[0].value;
        existingRow.cells[2].textContent = inputs[1].value;
      } else {
        const row = tbody.insertRow();
        row.className = 'category-row';
        row.dataset.id = id;
        row.onclick = () => openViewModal(id);
        row.innerHTML = `
          <td>${id}</td>
          <td>${inputs[0].value}</td>
          <td>${inputs[1].value}</td>
          <td>${categoriesData[id].productCount}</td>
          <td onclick="event.stopPropagation()">
            <button class="btn-icon" onclick="openEditModal(${id})"><img src="../images/sua.png" alt="Sửa" class="icon-img"></button>
            <button class="btn-icon" onclick="deleteCategory(${id})"><img src="../images/huy.png" alt="Xóa" class="icon-img"></button>
          </td>
        `;
      }

      showToast('Lưu danh mục thành công');
      closeModal('categoryModal');
    });
  </script>
  <script src="js/admin.js"></script>
</body>
</html>
