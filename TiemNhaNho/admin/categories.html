<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lí Danh Mục - Admin</title>
    <link rel="stylesheet" href="../css/normalize.css" />
    <link rel="stylesheet" href="../icomoon/icomoon.css" />
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="css/admin-style.css" />
  </head>
  <body class="admin-layout">
    <div class="admin-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 class="logo">Tiệm Nhà Nhỏ</h2>
        </div>
        <nav class="sidebar-nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="dashboard.html" class="nav-link"
                ><i class="icon icon-home"></i><span>Dashboard</span></a
              >
            </li>
            <li class="nav-item">
              <a href="orders.html" class="nav-link"
                ><i class="icon icon-shopping-bag"></i
                ><span>Quản lí Đơn Hàng</span></a
              >
            </li>
            <li class="nav-item">
              <a href="products.html" class="nav-link"
                ><i class="icon icon-package"></i
                ><span>Quản lí Sản Phẩm</span></a
              >
            </li>
            <li class="nav-item">
              <a href="customers.html" class="nav-link"
                ><i class="icon icon-users"></i
                ><span>Quản lí Khách Hàng</span></a
              >
            </li>
            <li class="nav-item">
              <a href="suppliers.html" class="nav-link"
                ><i class="icon icon-truck"></i
                ><span>Quản lí Nhà Cung Cấp</span></a
              >
            </li>
            <li class="nav-item active">
              <a href="categories.html" class="nav-link"
                ><i class="icon icon-list"></i><span>Quản lí Danh Mục</span></a
              >
            </li>
            <li class="nav-item">
              <a href="coupons.html" class="nav-link"
                ><i class="icon icon-ticket"></i
                ><span>Quản lí Mã Giảm Giá</span></a
              >
            </li>
          </ul>
        </nav>
      </aside>

      <main class="main-content">
        <header class="admin-header">
          <div class="header-left">
            <h1>Quản lí Danh Mục</h1>
          </div>
        </header>

        <section class="page-content">
          <div class="container-fluid">
            <div class="card">
              <div class="card-header">
                <h3>Danh Sách Danh Mục</h3>
                <div style="display: flex; gap: 1rem; align-items: center">
                  <input
                    type="text"
                    id="searchInput"
                    placeholder="Tìm kiếm danh mục..."
                    onkeyup="searchTable()"
                    style="
                      padding: 0.5rem 1rem;
                      border: 1px solid #ddd;
                      border-radius: 4px;
                      width: 250px;
                    "
                  />
                  <button class="btn btn-primary" onclick="openAddModal()">
                    + Thêm Danh Mục
                  </button>
                </div>
              </div>

              <table class="table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Tên Danh Mục</th>
                    <th>Hành Động</th>
                  </tr>
                </thead>
                <tbody id="categoriesBody">
                  <tr class="category-row" onclick="openViewModal(1)">
                    <td>1</td>
                    <td>Nam</td>
                    <td onclick="event.stopPropagation()">
                      <button
                        class="btn-icon"
                        onclick="openEditModal(1)"
                        title="Sửa"
                      >
                        <img
                          src="../public/sua.png"
                          alt="Sửa"
                          class="icon-img"
                        />
                      </button>
                      <button
                        class="btn-icon"
                        onclick="deleteCategory(1)"
                        title="Xóa"
                      >
                        <img
                          src="../public/huy.png"
                          alt="Xóa"
                          class="icon-img"
                        />
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div class="modal" id="categoryModal">
      <div class="modal-content" style="padding: 24px">
        <div class="modal-header">
          <h2>Thêm/Sửa Danh Mục</h2>
          <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="categoryForm">
          <div class="form-group">
            <label>Tên Danh Mục</label>
            <input type="text" required />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeModal()"
            >
              Hủy
            </button>
            <button type="submit" class="btn btn-primary">Lưu</button>
          </div>
        </form>
      </div>
    </div>

    <script src="../js/jquery-1.11.0.min.js"></script>
    <script src="js/admin.js"></script>
    <script type="module">
      import {
        getAllCategories,
        openCategoryModal,
        handleCategorySubmit,
        deleteCategory,
      } from "./js/categories-manager.js";

      document.addEventListener("DOMContentLoaded", getAllCategories);

      window.openCategoryModal = openCategoryModal;
      window.deleteCategory = deleteCategory;

      window.openAddModal = function () {
        openCategoryModal("add");
      };

      window.openEditModal = function (id) {
        openCategoryModal("edit", id);
      };

      // Override searchTable
      window.searchTable = function () {
        const input = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const tbody = document.getElementById("categoriesBody");
        const rows = tbody.getElementsByTagName("tr");

        for (let row of rows) {
          const name = row.cells[1]?.textContent || "";
          const description = row.cells[2]?.textContent || "";
          if (
            name.toLowerCase().includes(input) ||
            description.toLowerCase().includes(input)
          ) {
            row.style.display = "";
          } else {
            row.style.display = "none";
          }
        }
      };

      document
        .getElementById("categoryForm")
        .addEventListener("submit", handleCategorySubmit);

      // Swipe listener for modal closing - keeping UI consistency
      function addSwipeListener(modalId) {
        const modal = document.getElementById(modalId);
        if (!modal) return;
        let touchStartY = 0;
        modal.addEventListener("touchstart", (e) => {
          touchStartY = e.touches[0].clientY;
        });
        modal.addEventListener("touchend", (e) => {
          if (touchStartY - e.changedTouches[0].clientY > 100) {
            modal.classList.add("closing");
            setTimeout(() => {
              modal.style.display = "none";
              modal.classList.remove("closing");
            }, 300);
          }
        });
      }

      addSwipeListener("categoryModal");
    </script>
  </body>
</html>
