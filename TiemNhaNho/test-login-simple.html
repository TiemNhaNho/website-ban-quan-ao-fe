<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #555;
        }
        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            background: #f0f0f0;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        .tab.active {
            background: #333;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Test Login/Register</h1>
    
    <div id="message" class="message"></div>
    
    <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
    </div>
    
    <!-- Login Form -->
    <div id="login-tab" class="tab-content active">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="username" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
    
    <!-- Register Form -->
    <div id="register-tab" class="tab-content">
        <h2>Register</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Email:</label>
                <input type="email" name="username" required>
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password" minlength="8" required>
            </div>
            <button type="submit">Register</button>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Update tab content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            
            setTimeout(() => {
                msg.style.display = 'none';
            }, 5000);
        }
        
        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('Login form submitted');
            
            const email = this.querySelector('input[name="username"]').value;
            const password = this.querySelector('input[name="password"]').value;
            
            console.log('Email:', email);
            console.log('Password length:', password.length);
            
            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                    }),
                });
                
                const data = await response.json();
                console.log('Response:', data);
                
                if (data.code === '200' && data.data) {
                    localStorage.setItem('access_token', data.data.access_token);
                    showMessage('Login successful!', 'success');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showMessage(data.message || 'Login failed', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Connection error: ' + error.message, 'error');
            }
        });
        
        // Register Handler
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('Register form submitted');
            
            const email = this.querySelector('input[name="username"]').value;
            const password = this.querySelector('input[name="password"]').value;
            
            console.log('Email:', email);
            console.log('Password length:', password.length);
            
            if (password.length < 8) {
                showMessage('Password must be at least 8 characters', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: email.split('@')[0],
                        email: email,
                        password: password,
                    }),
                });
                
                const data = await response.json();
                console.log('Response:', data);
                
                if (data.code === '201') {
                    showMessage('Registration successful! You can login now.', 'success');
                    
                    setTimeout(() => {
                        switchTab('login');
                        document.querySelector('#loginForm input[name="username"]').value = email;
                    }, 1500);
                } else {
                    showMessage(data.message || 'Registration failed', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('Connection error: ' + error.message, 'error');
            }
        });
        
        console.log('Script loaded successfully');
        console.log('Login form:', document.getElementById('loginForm'));
        console.log('Register form:', document.getElementById('registerForm'));
    </script>
</body>
</html>
